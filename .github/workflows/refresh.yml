name: Refresh Data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest current season matches (PD, PL, SA, CL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALLDATA_KEY: ${{ secrets.FOOTBALLDATA_KEY }}
        run: |
          for comp in PD PL SA CL; do
            echo "Ingesting $comp for current season (2026)..."
            python ingestion/load_matches.py "$comp" 2026
            echo "Sleeping 15 seconds to respect API rate limits..."
            sleep 15
          done

      - name: Run simulations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          for comp in PD PL SA CL; do
            echo "Running simulation for $comp..."
            python analysis/save_simulation.py "$comp" 2026
          done
